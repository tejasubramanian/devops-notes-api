name: Deploy Node.js API to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DEVOPS_TODO_NOTES }}
          script: |
            cd ~/devops-notes-api
            git pull origin main
            npm install
            pm2 restart devops-notes-api
