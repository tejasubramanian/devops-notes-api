name: Deploy Docker API to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tejasubramanian
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t tejasubramanian/devops-notes-api:v1 .

      - name: Push Docker image
        run: docker push tejasubramanian/devops-notes-api:v1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DEVOPS_TODO_NOTES }}
          script: |
            docker pull tejasubramanian/devops-notes-api:v1
            docker stop devops-notes-api-docker || true
            docker rm devops-notes-api-docker || true
            docker run -d \
              --name devops-notes-api-docker \
              --restart unless-stopped \
              -p 3001:3000 \
              tejasubramanian/devops-notes-api:v1
